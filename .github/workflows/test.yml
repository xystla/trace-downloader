name: test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python packaging/fetch_ffmpeg.py
      - run: python -m pytest -q
      - run: python -m compileall -q src gui packaging
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check gui/web/app.js
